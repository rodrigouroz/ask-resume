<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns# profile: https://ogp.me/ns/profile#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{PROFILE_TITLE}}</title>
    <meta name="description" content="{{PROFILE_DESCRIPTION}}" />
    <meta name="author" content="{{PROFILE_AUTHOR}}" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="{{PROFILE_CANONICAL_URL}}" />
    <link rel="icon" href="{{PROFILE_FAVICON}}" type="image/svg+xml" />

    <meta property="og:title" content="{{PROFILE_TITLE}}" />
    <meta property="og:description" content="{{PROFILE_SOCIAL_DESCRIPTION}}" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="{{PROFILE_CANONICAL_URL}}" />
    <meta property="og:site_name" content="{{PROFILE_SITE_NAME}}" />
    <meta property="og:locale" content="{{PROFILE_LOCALE}}" />
    <meta property="profile:first_name" content="{{PROFILE_FIRST_NAME}}" />
    <meta property="profile:last_name" content="{{PROFILE_LAST_NAME}}" />
    <meta property="og:image" content="{{PROFILE_SOCIAL_IMAGE}}" />
    <meta property="og:image:secure_url" content="{{PROFILE_SOCIAL_IMAGE}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="{{PROFILE_SOCIAL_IMAGE_WIDTH}}" />
    <meta property="og:image:height" content="{{PROFILE_SOCIAL_IMAGE_HEIGHT}}" />
    <meta property="og:image:alt" content="{{PROFILE_SOCIAL_IMAGE_ALT}}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{PROFILE_TITLE}}" />
    <meta name="twitter:description" content="{{PROFILE_SOCIAL_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{PROFILE_SOCIAL_IMAGE}}" />
    <meta name="twitter:image:alt" content="{{PROFILE_SOCIAL_IMAGE_ALT}}" />

    <script type="application/ld+json">
      {{PROFILE_STRUCTURED_DATA}}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
